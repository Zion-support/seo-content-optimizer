<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>SEO Content Optimizer</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input,textarea{width:100%;padding:.5rem;margin:.2rem 0}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📈 SEO Content Optimizer</h1><p>Score your content for a target keyword.</p><input id="k" placeholder="Target keyword"><textarea id="t" rows="5" placeholder="Paste page content..."></textarea><button onclick="go()">Score</button><div id="out"></div><script>function go(){const k=document.getElementById('k').value.toLowerCase(),t=document.getElementById('t').value.toLowerCase();const w=t.split(/\s+/).length,c=k?t.split(k).length-1:0,d=w?((c/w)*100).toFixed(1):0;let tips=[];if(d<0.5)tips.push('Increase keyword usage');if(d>3)tips.push('Keyword stuffing risk — reduce density');if(w<300)tips.push('Add content: aim for 600+ words');if(!t.includes('http'))tips.push('Add internal/external links');document.getElementById('out').textContent=`Words: ${w}\nKeyword occurrences: ${c} (${d}%)\nScore: ${Math.max(0,100-tips.length*20)}/100\n\nRecommendations:\n${tips.length?tips.map(x=>'• '+x).join('\n'):'• Looks great!'}\n\nFull SEO audit of your site: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/seo-content-optimizer">GitHub</a> · <a href="https://ziontechgroup.com/ai-social-manager/">Social Manager</a></p></body></html>
